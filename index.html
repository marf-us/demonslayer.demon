<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фракция Демонов · Demonslayer#2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');

        body {
            background: #1a0c0c;
            color: #e0c0c0;
            font-family: 'Cinzel', 'Times New Roman', serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-top: 0;
        }

        /* ФОН: чёрная пыль / пепел */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(40,0,0,0.6) 0%, transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(20,0,0,0.8) 0%, transparent 40%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 2px, 
                                          rgba(30,0,0,0.1) 2px, rgba(30,0,0,0.1) 6px);
            pointer-events: none;
            z-index: 0;
        }

        /* Фоновый пепел (общий) */
        .ash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ash-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(60,60,60,0.2) 0%, rgba(10,10,10,0.6) 80%);
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.5;
            animation: floatAsh linear infinite;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        @keyframes floatAsh {
            0% { transform: translateY(100vh) translateX(-20px) scale(0.6); opacity: 0.1; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) translateX(40px) scale(1.2); opacity: 0; }
        }

        /* ===== ШАПКА С КАРТИНКОЙ НА ВЕСЬ РАЗМЕР ===== */
        .header {
            width: 100%;
            height: 380px;
            position: relative;
            z-index: 10;
            overflow: hidden;
            border-bottom: 4px solid #8b0000;
            box-shadow: 0 8px 50px rgba(80, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.55) saturate(1.3) contrast(1.1);
            z-index: 1;
        }

        .header-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(10,2,2,0.75) 100%);
            z-index: 2;
        }

        .header-content {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .header-content i {
            font-size: 3.5rem;
            color: #cc3333;
            text-shadow: 0 0 40px #ff3333, 0 0 80px #aa0000;
            -webkit-text-fill-color: initial;
        }

        .header-title {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #f0c0c0, #d43b3b, #5a0a0a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px #aa0000, 0 0 120px #550000, 0 4px 20px rgba(0,0,0,0.8);
            font-family: 'Cinzel', serif;
            line-height: 1.2;
        }

        .header-subtitle {
            font-size: 1.3rem;
            color: #d08080;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 30px #aa3333, 0 2px 10px rgba(0,0,0,0.9);
            font-weight: 400;
            border-top: 2px solid rgba(180, 40, 40, 0.4);
            padding-top: 8px;
            -webkit-text-fill-color: #d08080;
        }

        /* ===== ВКЛАДКИ ПОД ШАПКОЙ ===== */
        .tabs-wrapper {
            width: 100%;
            background: #0f0505;
            border-bottom: 3px solid #5a1a1a;
            padding: 14px 40px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 25px rgba(0,0,0,0.7);
        }

        .tab-btn {
            background: #1f0a0a;
            color: #b07a7a;
            border: 1px solid #5a1a1a;
            padding: 12px 28px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.6);
            background: #130808;
            color: #b08080;
            border-bottom: 3px solid transparent;
        }

        .tab-btn i {
            margin-right: 10px;
            color: #a33;
            font-size: 1rem;
        }

        .tab-btn:hover {
            background: #2f1010;
            color: #f0c0c0;
            border-bottom: 3px solid #cc4444;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(180, 0, 0, 0.5);
        }

        .tab-btn.active {
            background: #2f0a0a;
            color: #f0d0d0;
            border-bottom: 3px solid #ff3333;
            background: #1f0505;
            text-shadow: 0 0 15px #ff5555;
            box-shadow: 0 -2px 25px rgba(200, 0, 0, 0.6);
        }

        /* ===== КОНТЕНТ С ПАДАЮЩИМИ ЧАСТИЦАМИ ПЕПЛА ===== */
        .content {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 40px auto 50px;
            padding: 80px 30px;
            background: rgba(10, 2, 2, 0.7);
            backdrop-filter: blur(3px);
            border-radius: 40px 12px 40px 12px;
            border-left: 2px solid #6b1a1a;
            border-right: 2px solid #6b1a1a;
            box-shadow: 0 0 60px rgba(80, 0, 0, 0.4);
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Частицы пепла внутри контента */
        .content-ash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .content-ash-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(180, 160, 160, 0.15) 0%, rgba(60, 50, 50, 0.4) 80%);
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.4;
            animation: fallAsh linear infinite;
            box-shadow: 0 0 30px rgba(100, 80, 80, 0.1);
        }

        @keyframes fallAsh {
            0% { transform: translateY(-20px) translateX(-10px) scale(0.6) rotate(0deg); opacity: 0.1; }
            10% { opacity: 0.5; }
            90% { opacity: 0.3; }
            100% { transform: translateY(calc(100vh)) translateX(30px) scale(1.1) rotate(360deg); opacity: 0; }
        }

        .tab-page {
            display: none;
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            color: #6a3a3a;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.6;
            position: relative;
            z-index: 1;
        }

        .tab-page.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .tab-page i {
            font-size: 3.5rem;
            color: #4a1a1a;
            display: block;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            0% { opacity: 0.2; transform: scale(0.98); }
            100% { opacity: 0.6; transform: scale(1); }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 1000px) {
            .header { height: 280px; }
            .header-title { font-size: 2.8rem; letter-spacing: 5px; }
            .header-content i { font-size: 2.5rem; }
            .header-subtitle { font-size: 1rem; }

            .tabs-wrapper {
                padding: 12px 16px;
                gap: 6px;
            }
            .tab-btn {
                font-size: 0.7rem;
                padding: 8px 16px;
                letter-spacing: 1px;
            }
            .tab-btn i { margin-right: 6px; font-size: 0.8rem; }

            .content {
                padding: 50px 16px;
                margin: 20px 10px;
                min-height: 40vh;
            }
            .tab-page {
                font-size: 1.1rem;
            }
            .tab-page i { font-size: 2.5rem; }
        }

        @media (max-width: 600px) {
            .header { height: 220px; }
            .header-title {
                font-size: 1.6rem;
                letter-spacing: 3px;
            }
            .header-content i { font-size: 1.8rem; }
            .header-subtitle {
                font-size: 0.7rem;
                letter-spacing: 2px;
            }
            .header-content { padding: 10px 16px; }

            .tabs-wrapper {
                padding: 8px 10px;
                gap: 4px;
            }
            .tab-btn {
                font-size: 0.55rem;
                padding: 5px 10px;
                letter-spacing: 0.5px;
                border-radius: 6px 6px 0 0;
            }
            .tab-btn i { margin-right: 3px; font-size: 0.65rem; }

            .content {
                padding: 30px 12px;
                min-height: 30vh;
                border-radius: 20px 6px 20px 6px;
            }
            .tab-page {
                font-size: 0.9rem;
            }
            .tab-page i { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- Фоновый пепел (общий) -->
    <div class="ash-overlay" id="ashOverlay"></div>

    <!-- ===== ШАПКА С КАРТИНКОЙ НА ВЕСЬ РАЗМЕР ===== -->
    <header class="header">
        <img class="header-bg" src="https://i.ibb.co/fzCr987C/header-logo.png" alt="Фракция Демонов">
        <div class="header-overlay"></div>
        <div class="header-content">
            <i class="fas fa-skull"></i>
            <div class="header-title">Фракция Демонов</div>
            <div class="header-subtitle">Demonslayer#2 · Кровавый орден</div>
        </div>
    </header>

    <!-- ===== ВКЛАДКИ ПОД ШАПКОЙ ===== -->
    <div class="tabs-wrapper">
        <button class="tab-btn active" data-tab="info"><i class="fas fa-scroll"></i> Информация</button>
        <button class="tab-btn" data-tab="oaths"><i class="fas fa-hand-fist"></i> Клятвы</button>
        <button class="tab-btn" data-tab="ranks"><i class="fas fa-arrow-up"></i> Повышение</button>
        <button class="tab-btn" data-tab="circles"><i class="fas fa-circle"></i> Круги крови</button>
        <button class="tab-btn" data-tab="duels"><i class="fas fa-swords"></i> Дуэли</button>
        <button class="tab-btn" data-tab="territory"><i class="fas fa-map"></i> Территория</button>
    </div>

    <!-- ===== КОНТЕНТ С ПАДАЮЩИМИ ЧАСТИЦАМИ ===== -->
    <div class="content">
        <!-- Падающие частицы пепла внутри контента -->
        <div class="content-ash" id="contentAsh"></div>

        <div id="info" class="tab-page active">
            <i class="fas fa-scroll"></i>
            Информация
        </div>
        <div id="oaths" class="tab-page">
            <i class="fas fa-hand-fist"></i>
            Клятвы
        </div>
        <div id="ranks" class="tab-page">
            <i class="fas fa-arrow-up"></i>
            Повышение
        </div>
        <div id="circles" class="tab-page">
            <i class="fas fa-circle"></i>
            Круги крови
        </div>
        <div id="duels" class="tab-page">
            <i class="fas fa-swords"></i>
            Дуэли
        </div>
        <div id="territory" class="tab-page">
            <i class="fas fa-map"></i>
            Территория
        </div>
    </div>

    <script>
        (function() {
            // ===== ГЕНЕРАЦИЯ ФОНОВОГО ПЕПЛА =====
            const ashContainer = document.getElementById('ashOverlay');
            for (let i = 0; i < 45; i++) {
                const particle = document.createElement('div');
                particle.className = 'ash-particle';
                const size = 12 + Math.random() * 50;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = '-10%';
                particle.style.animationDuration = 15 + Math.random() * 35 + 's';
                particle.style.animationDelay = Math.random() * 25 + 's';
                particle.style.opacity = 0.15 + Math.random() * 0.4;
                ashContainer.appendChild(particle);
            }

            // ===== ГЕНЕРАЦИЯ ПАДАЮЩИХ ЧАСТИЦ В КОНТЕНТЕ =====
            const contentAsh = document.getElementById('contentAsh');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'content-ash-particle';
                const size = 6 + Math.random() * 25;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = '-10%';
                particle.style.animationDuration = 12 + Math.random() * 25 + 's';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.opacity = 0.2 + Math.random() * 0.4;
                contentAsh.appendChild(particle);
            }

            // ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК =====
            const tabs = document.querySelectorAll('.tab-btn');
            const pages = {
                info: document.getElementById('info'),
                oaths: document.getElementById('oaths'),
                ranks: document.getElementById('ranks'),
                circles: document.getElementById('circles'),
                duels: document.getElementById('duels'),
                territory: document.getElementById('territory')
            };

            function setActiveTab(tabId) {
                tabs.forEach(btn => btn.classList.remove('active'));
                Object.values(pages).forEach(page => page.classList.remove('active'));

                const activeBtn = Array.from(tabs).find(btn => btn.dataset.tab === tabId);
                if (activeBtn) activeBtn.classList.add('active');
                if (pages[tabId]) pages[tabId].classList.add('active');
            }

            tabs.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const tabId = this.dataset.tab;
                    if (tabId) setActiveTab(tabId);
                });
            });

            // активируем первую вкладку
            const firstActive = document.querySelector('.tab-btn.active');
            if (firstActive) {
                const firstTab = firstActive.dataset.tab;
                if (firstTab && pages[firstTab]) {
                    Object.values(pages).forEach(p => p.classList.remove('active'));
                    pages[firstTab].classList.add('active');
                }
            } else {
                setActiveTab('info');
            }
        })();
    </script>
</body>
</html>
